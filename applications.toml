# Applications shown by the Neutron Imaging Launcher (rust_unified_launcher).
#
# Edit this file, then press "Reload config" in the running launcher (or just
# restart it) — no recompile needed.
#
# Entry format:
#   [[app]]
#   name        = "Shown in the list"
#   description = "One line under the name"
#   category    = "id of a [[category]] below"
#   command     = ["argv0", "arg1", ...]     # scripts go through /bin/bash
#   workdir     = "/optional/working/dir"    # default: dir of the checked path
#   preview     = "/optional/screenshot.png" # shown in the right-hand panel
#   check_path  = "/optional/path"           # availability check; default is
#                                            # the last absolute path in command
#   in_terminal = true                       # open in gnome-terminal/xterm so
#                                            # console output stays visible
#   clear_fontconfig = true                  # rm -rf ~/.cache/fontconfig first
#   tags        = ["extra", "search", "words"]

title = "Neutron Imaging Launcher"
subtitle = "All VENUS / MARS imaging applications in one place"

[[category]]
id = "rust"
name = "Rust Applications"

[[category]]
id = "jupyter"
name = "Jupyter Notebooks"

[[category]]
id = "marimo"
name = "Marimo Notebooks"

[[category]]
id = "python"
name = "Python & Other Apps"

# --------------------------------------------------------------------------
# Rust applications
# --------------------------------------------------------------------------

[[app]]
name = "TIFF Viewer"
description = "Browse and inspect folders of TIFF images from a measurement."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_tiff_viewer/launch_rust_tiff_viewer.sh"]
tags = ["images", "viewer"]

[[app]]
name = "TOF Profile Viewer"
description = "Browse TIFF stacks from a VENUS/Timepix measurement and plot TOF profiles."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_tof_profile_viewer/launch_tof_profile_viewer.sh"]
tags = ["time of flight"]

[[app]]
name = "ROI Selector"
description = "Select regions of interest on an imaging data set and export a mask file."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_roi_selector/launch_roi_selector.sh"]
tags = ["mask", "region"]

[[app]]
name = "Crop TIFF"
description = "Select a rectangular crop region on a TIFF or .npy stack and export it."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_crop_tiff/launch_crop_tiff.sh"]

[[app]]
name = "CT Reconstruction"
description = "Neutron CT reconstruction workflows for VENUS and MARS."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_ct_reconstruction/launch_ct_reconstruction.sh"]
tags = ["tomography"]

[[app]]
name = "Hyperspectral Masker"
description = "Create a copy of an input data set with selected pixels masked."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_hyperspectra_masker/launch_rust_hyperspectral_makser.sh"]

[[app]]
name = "Auto Normalization Monitor"
description = "Monitor the state of the VENUS auto normalization pipeline."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_autonormalization_monitor/launch_autonormalization_monitor.sh"]

[[app]]
name = "BM3D ORNL GUI"
description = "Denoise imaging data / sinograms with the BM3D ORNL algorithm."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_bm3dornl/launch_bm3dornl_gui.sh"]
tags = ["denoise"]

[[app]]
name = "NRAD Spot Cleaner"
description = "Remove spots and hot pixels from radiographs with the NRAD algorithms."
category = "rust"
command = ["/SNS/VENUS/shared/software/bin/nrad-gui"]

[[app]]
name = "Timepix3 Tool (rustpix)"
description = "Process Timepix3 (TPX3) pixel detector data with the rustpix GUI."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rustpix/launch_rustpix.sh"]
tags = ["tpx3", "detector"]

