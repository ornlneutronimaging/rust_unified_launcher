[[app]]
name = "Median Filter"
description = "Median filter of a TOF image stack, built on the Neutron Image Viewer — e.g. to remove the zeros of an open beam. Neighbourhood = N × N pixels × M TOF bins; replace only the selected pixels (zeros, NaN / inf, below / above a threshold — every other pixel keeps its value) or every pixel (classic median filter); selected pixels can be ignored as neighbours so clusters of zeros are filled. Before / after statistics (zeros, NaN, min, max, mean, std, median) and histograms for every image or the integrated image; original and filtered stacks side by side in the embedded viewer (mirrored ROIs, profiles vs TOF / lambda / energy). Export to a new folder: filtered images under the input file names, every additional file of the input folder copied (spectra file, shutter files, …), summed image recomputed, provenance JSON. Folder, file, drag-and-drop or run number as input; headless mode."
category = "rust"
instruments = ["venus"]
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_median_filter/launch_median_filter.sh"]
preview = "/SNS/VENUS/shared/software/git/rust_unified_launcher/previews/rust_median_filter_preview.png"
