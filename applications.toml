[[app]]
name = "Tool Advisor"
description = "Not sure which application to use? Give the beamline and the IPTS of your experiment (its detectors tell white beam from TOF), describe what you want to do with your data in your own words, and get the workflow to follow: numbered steps, each with a button that starts the right application of this portal. Leave the description empty to browse every workflow (normalization, CT reconstruction, Bragg edges, resonances, sample drift, cleaning, cropping, masking, stitching, figures and movies…)."
category = "rust"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_tool_advisor/launch_tool_advisor.sh"]
preview = "/SNS/VENUS/shared/software/git/rust_unified_launcher/previews/rust_tool_advisor_preview.png"
tags = ["advisor", "help", "guide", "wizard", "workflow", "which tool", "where to start", "recommend", "suggest", "ipts", "venus", "mars"]
ask_examples = ["which application should I use", "I do not know where to start", "what should I do with my data", "guide me through the analysis of my experiment"]

