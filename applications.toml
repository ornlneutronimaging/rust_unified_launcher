[[app]]
name = "iBeatles 2.0 (in development)"
description = "Rust rewrite of iBeatles for Bragg-edge neutron imaging, following the iBEAMS (iBeatles web) workflow. In development. What exists: load the sample and the open beam (folders or run numbers, quick look on hover, several runs combined frame by frame: mean / add / median), check them with a region-of-interest profile versus frame, TOF or wavelength; rebin in TOF with the TOF Profile Viewer (same bins for the sample and the open beam, written to tof_rebin/); define the pre-mask (automatic from the pixel values, or drawn in the Sample Masker) and the normalization settings; choose the material (pre-defined or user-defined) and see its Bragg edges on the profile; a log of everything done. The saved configuration runs the same process without a window (--no-gui --config). Running the normalization, masking, binning, fitting and strain mapping are not available yet."
category = "beta"
instruments = ["venus"]
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_ibeatles/launch_ibeatles.sh"]
preview = "/SNS/VENUS/shared/software/git/rust_unified_launcher/previews/rust_ibeatles_preview.png"
tags = ["ibeatles", "ibeams", "bragg", "edge", "strain", "tof", "combine", "rebin", "open beam", "venus", "beta", "development"]

