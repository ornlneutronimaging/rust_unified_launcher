[[app]]
name = "Application Launch Tests"
description = "Web dashboard that test-launches every application of this portal on a headless display (window came up? headless tasks OK?) and shows a green check or a red cross per application, with a screenshot and the log of each; run everything, re-run the failed ones or a single application."
category = "cis"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_app_tester/launch_app_tester_dashboard.sh"]
preview = "/SNS/VENUS/shared/software/git/rust_unified_launcher/previews/rust_app_tester_preview.png"
in_terminal = true
hold_terminal = true
requires_browser = true
tags = ["test", "tests", "launch", "smoke", "health", "check", "dashboard", "green", "red", "broken", "regression", "cis"]
ask_examples = ["do all the applications still start", "which applications are broken", "test every tool"]

[[app]]
name = "Fourier Explorer"
description = "Learn the 2-D Fourier transform of an image: the image on the left (Lenna, synthetic patterns or any PNG / JPEG / TIFF), its spectrum on the right; apply low-pass / high-pass / band-pass filters (ideal, Butterworth, Gaussian), draw regions on the spectrum to remove or keep, probe a pixel to see the wave it stands for, and watch the image rebuilt from what is left."
category = "cis"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_fourier_explorer/launch_rust_fourier_explorer.sh"]
preview = "/SNS/VENUS/shared/software/git/rust_unified_launcher/previews/rust_fourier_explorer_preview.png"
tags = ["fourier", "fft", "spectrum", "frequency", "filter", "low-pass", "high-pass", "learning", "teaching", "lenna"]
ask_examples = ["how does the fourier transform of an image work", "what does a low pass filter do to an image", "remove stripes in frequency space", "see the spectrum of an image"]

[[app]]
name = "Silhouette & Number of Clusters"
description = "Learn how the silhouette score (Rousseeuw, 1987) picks the number of clusters k of a segmentation: tab 1 plays with synthetic blobs (mean silhouette vs k, cluster scatter, silhouette plot, a/b/s of any point); tab 2 runs a real UMAP segmentation of a TOF stack — by default the VENUS Mona Lisa (IPTS-38814, Run 30127): a copper plate whose picture is invisible in transmission and only encoded in the Bragg-edge spectra — pixel spectra → UMAP → k-means for k = 2…k max → silhouette curve, embedding, segmentation map over the image (the face appears), mean spectrum per cluster vs λ; CSV / TIFF export."
category = "cis"
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_silhouette_demo/launch_silhouette_demo.sh"]
preview = "/SNS/VENUS/shared/software/git/rust_unified_launcher/previews/rust_silhouette_demo_preview.png"
tags = ["silhouette", "clusters", "k-means", "kmeans", "umap", "segmentation", "number of clusters", "learning", "teaching", "mona lisa", "spectra", "bragg edge"]
ask_examples = ["how many clusters should I use", "what is the silhouette score", "how does umap segmentation work", "segment a tof stack by spectrum"]

[[app]]
name = "Chip Ratio Corrector"
description = "One Timepix chip sits at a level offset from the three others (seen on IPTS-37891): load the TIFF stack (normalized or raw), draw a background ROI on a good chip (reference) and one on the bad chip (target); the ratio of their means multiplies the bad chip (its quadrant, the ROI only, or a custom rectangle; one ratio for the stack or one per frame) over every frame. Before / after images side by side with the same display range, the per-frame means of both ROIs (target before and after) and the line profile across the chips on one plot, export of the corrected stack as float32 TIFF with a JSON report; the setup (ROIs, region, mode) can be saved and replayed headless with --apply --setup."
category = "cis"
instruments = ["venus"]
command = ["/bin/bash", "/SNS/VENUS/shared/software/git/rust_chip_ratio_corrector/launch_chip_ratio_corrector.sh"]
preview = "/SNS/VENUS/shared/software/git/rust_unified_launcher/previews/rust_chip_ratio_corrector_preview.png"
tags = ["chip", "chips", "timepix", "mcp", "offset", "ratio", "level", "quadrant", "background", "roi", "correction", "normalized", "tof", "cis"]
ask_examples = ["one chip is brighter than the others", "fix a chip offset", "level the chips of a timepix stack", "correct a bad chip with a ratio"]

