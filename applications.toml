# Applications shown by the Neutron Imaging Launcher (rust_unified_launcher).
#
# Edit this file, then press "Reload config" in the running launcher (or just
# restart it) — no recompile needed.
#
# Entry format:
#   [[app]]
#   name        = "Shown in the list"
#   description = "One line under the name"
#   category    = "id of a [[category]] below"
#   section     = "Optional sub-section"     # smaller header inside the
#                                            # category; keep apps of the same
#                                            # section consecutive in this file
#   instruments = ["venus"]                  # ids of the [[instrument]]s this
#                                            # app is for: hidden while another
#                                            # instrument is selected at the top
#                                            # of the window. Omit for a tool
#                                            # common to every instrument
#   command     = ["argv0", "arg1", ...]     # scripts go through /bin/bash
#   url         = "https://..."              # open a web page in the default
#                                            # browser instead of running a
#                                            # command (command may be omitted)
#   workdir     = "/optional/working/dir"    # default: dir of the checked path
#   preview     = "/optional/screenshot.png" # shown in the right-hand panel
#   check_path  = "/optional/path"           # availability check; default is
#                                            # the last absolute path in command
#   in_terminal = true                       # open in gnome-terminal/xterm so
#                                            # console output stays visible
#   hold_terminal = true                     # with in_terminal: keep the window
#                                            # open after the command exits
#                                            # ("Press Enter to close"), for
#                                            # tools that print a report & quit
#   clear_fontconfig = true                  # rm -rf ~/.cache/fontconfig first
#   requires_browser = true                  # tool opens a web browser: the
#                                            # Firefox profile lock is checked
#                                            # before launching (Fix browser
#                                            # issue / Launch anyway) and the
#                                            # preview panel shows the fix
#                                            # button. Unset: guessed from the
#                                            # command/tags; false: never
#   tags        = ["extra", "search", "words"]
#   ask_examples = ["did my sample move"]    # questions this tool answers, in
#                                            # the user's words; read only by
#                                            # the Ask box (see [ask] below)
#
# A [[category]] may declare passwords:
#   passwords = ["word1", "word2"]           # category is locked (🔒) until one
#                                            # of these is typed (case doesn't
#                                            # matter); its apps stay hidden
#                                            # from All / search / Recently
#                                            # used until unlocked
# or be reserved for some users:
#   users = ["login1", "login2"]             # category shown to these logins
#                                            # ($USER) only; for everyone else
#                                            # it and its apps do not exist
#                                            # (no sidebar entry, no search,
#                                            # no Ask hit, no 🔒 prompt)
#
# An [[instrument]] is a button of the instrument selector at the top of the
# window. The launcher lists the apps of the selected instrument only: those
# naming it in `instruments`, plus those with no `instruments` at all.
#   [[instrument]]
#   id    = "venus"                          # used in `instruments = [...]`
#   name  = "VENUS"                          # shown on the button
#   hosts = ["bl10"]                         # optional: selected when the
#                                            # launcher starts on a machine
#                                            # whose host name starts with one
#                                            # of these; on any other machine
#                                            # the first [[instrument]] is.
#                                            # A click on another button lasts
#                                            # until the launcher is closed
#   backdrop = "/path/picture.jpg"           # optional: PNG / JPEG shown faded
#                                            # behind the window while this
#                                            # instrument is selected
#   backdrop_fit = "corner"                  # optional: the whole picture
#                                            # rises from the lower right
#                                            # corner (a planet on a
#                                            # transparent background);
#                                            # default "cover": the picture
#                                            # fills the window, cropped
#
# A [[notice]] is an announcement shown to every user under the header, with
# a "Got it" button that hides it for that user (change the id to show an
# edited text again to those who dismissed it):
#   [[notice]]
#   id      = "unique-key"
#   text    = "What users should know."
#   until   = "2026-12-31"                   # optional: hidden for everyone
#                                            # after that day
#   warning = true                           # optional: ⚠ orange instead of
#                                            # ℹ blue

title = "Neutron Imaging Launcher"
subtitle = "All VENUS / MARS imaging applications in one place"

[[notice]]
id = "tiff-viewer-renamed-2026-10"
text = "The TIFF Viewer is now the Neutron Image Viewer (Rust tools category): same viewer, new name — with a menu bar, a brush tool, a joint histogram of two stacks, saved configurations and NeXus / HDF5 arrays loaded as stacks. Scripts calling launch_rust_tiff_viewer.sh keep working."
until = "2027-01-31"

[[notice]]
id = "normalization-app-2026-11"
text = "Normalization has a new home: use the Normalization (VENUS & MARS) application (Rust Applications) for white-beam and TOF data, at VENUS and MARS. Same NeuNorm numerics and the same configuration files as the marimo normalization notebooks, which will be retired on December 11, 2026. Not sure which application to use for your data? Try the new Tool Advisor (first entry of Rust Applications)."
until = "2027-01-15"
warning = true

# Shared usage database: every launch appends one JSON line to
# <usage_db>/records/<user>.jsonl (user, local date/time, application,
# category, host). Viewed with the "Portal Usage Monitor" (CIS category).
# Comment out to disable recording.
usage_db = "/SNS/VENUS/shared/software/usage_db"

# The Ask box (under the filter): "describe what you want to do" in plain
# words, and the best-matching applications are listed under it. Plain
# keyword ranking, no AI: every word of the question (stemmed, stop words
# dropped) is looked up in each app's name, tags, ask_examples and
# description; name/tag/example hits weigh more than description hits.
# `synonyms` lists groups of words treated as equivalent, so "tiff" also
# hits an entry that only says "images". When a question lands on the wrong
# tool, add the user's wording to that tool's `ask_examples` (best) or
# `tags`, or extend a group here.
[ask]
# The application behind the "Guide me" button at the end of the Ask row
# (and the "whole workflow" link under the suggestions): it is started
# with `--ask <the question typed>`. Remove the line to hide the button.
advisor = "Tool Advisor"
synonyms = [
    ["tiff", "tif", "image", "images", "picture", "frame", "frames"],
    ["stack", "series", "runs", "run", "batch", "sequence", "folder", "folders"],
    ["nexus", "nxs", "h5", "hdf5", "hdf"],
    ["timepix", "tpx3", "tpx", "event", "events"],
    ["integrated", "integrate", "sum", "summed", "projection"],
    ["drift", "move", "moved", "motion", "shift", "shifted", "wobble", "stability"],
    ["align", "alignment", "register", "registration", "offset"],
    ["normalize", "normalization", "normalise", "normalisation", "ob", "open beam", "dark field", "df"],
    ["ct", "tomography", "tomographic", "reconstruction", "reconstruct", "recon", "sinogram"],
    ["tof", "time of flight", "wavelength", "lambda", "energy", "bragg", "bragg edge"],
    ["roi", "region", "crop", "cropping"],
    ["profile", "line profile", "lineout", "cross section"],
    ["histogram", "statistics", "stats"],
    ["outlier", "hot pixel", "dead pixel", "gamma", "despeckle", "denoise", "clean", "noise"],
    ["compare", "comparison", "difference", "diff", "overlay", "blink"],
    ["export", "save", "convert", "conversion"],
    ["notebook", "jupyter", "marimo"],
    ["plot", "graph", "chart", "curve"],
    ["metadata", "pv", "log", "logs", "temperature", "sensor"],
    ["resolution", "sharpness", "focus", "blur", "mtf", "psf"],
    ["radiograph", "radiography", "white beam", "2d"],
    ["monitor", "usage", "who", "when"],
]

# Library versions (admin view). Once a password-protected category is
# unlocked, a "Show library versions" switch at the top of its list shows,
# for each environment below, the version of its Python packages.
# `packages` are listed first (with "not installed" when missing, names
# compared case-insensitively); every other installed package sits behind
# the "All packages" section and the filter box. Add an environment by
# pointing `python` at the interpreter the tool actually runs with.
[library_versions]
packages = [
    "NeuNorm", "neutronbraggedge", "marimo", "jupyterlab", "notebook",
    "numpy", "scipy", "scikit-image", "matplotlib", "h5py", "astropy",
    "tifffile", "tomopy", "algotom", "svmbir", "mbirjax", "bm3dornl", "nrad",
    "imars3d",
]

[[library_versions.environment]]
name = "Marimo notebooks (general tools & dedicated IPTS)"
python = "/SNS/VENUS/shared/software/git/marimo_notebooks/.pixi/envs/default/bin/python"

[[library_versions.environment]]
name = "Marimo notebooks (beta)"
python = "/SNS/VENUS/shared/software/git/marimo_notebooks_development/.pixi/envs/default/bin/python"

[[library_versions.environment]]
name = "Jupyter notebooks"
python = "/SNS/VENUS/shared/software/git/python_notebooks/.pixi/envs/default/bin/python"

[[library_versions.environment]]
