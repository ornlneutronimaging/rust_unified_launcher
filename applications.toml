[[app]]
name = "TOF Polarization"
description = "Polarized time-of-flight neutron imaging (after Oji et al., Materials & Design 2023): load the spin-up / spin-down / open-beam runs, draw ROIs on the polarization image and get the TOF polarization of each ROI with a live precession fit (field B, inhomogeneity σ), pixel-wise B / σ maps, and export of the paper-style figures, CSV / TIFF files and results.json."
category = "beta"
instruments = ["venus"]
